name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  RUST_TOOLCHAIN: "1.94"
  RUST_TOOLCHAIN_COMPONENTS: rustfmt, clippy
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install stable Rust with clippy
        shell: bash
        run: |
          # Some orgs allow only GitHub-authored actions. Using rustup here keeps
          # the workflow portable without depending on marketplace allowlists.
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Run tests
        run: cargo test

      - name: Run clippy
        # CI treats warnings as failures so newly introduced unsafe escape hatches
        # or API drift do not quietly accumulate until release preparation.
        run: cargo clippy --all-targets --all-features -- -D warnings
